name: Check SSL Certificates

on:
  schedule:
    # รันทุกวันเวลา 08:00 น. เวลาไทย (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"
  # แก้รายชื่อ domain แล้วให้ result.json อัปเดตทันที ไม่ต้องรอรอบ schedule
  # (ถ้าไม่มี trigger นี้ result.json จะยังมี domain ที่ลบออกไปแล้ว จนถึงรอบถัดไป
  #  ทำให้ n8n อ่านของเก่าไปแจ้งเตือน domain ที่เลิก monitor แล้ว)
  push:
    branches:
      - main
    paths:
      - domains.txt
      - domains-internal.txt
      - check_ssl.py
      - .github/workflows/ssl-check.yml
  # อนุญาตให้กดรันด้วยตัวเองได้จากแท็บ Actions ของ GitHub (เพื่อทดสอบ)
  workflow_dispatch: {}

permissions:
  contents: write

# กันสองรอบชนกันตอน push (เช่นกด Run workflow ระหว่างที่ schedule กำลังรัน)
concurrency:
  group: ssl-check
  cancel-in-progress: false

jobs:
  check-ssl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # runner ของ GitHub อยู่บน cloud จึงเช็กได้แค่ scope public
      # ส่วน domain ใน domains-internal.txt ต้องรันจากเครื่องใน network องค์กร
      - name: Run SSL check script
        run: python check_ssl.py --scope public

      - name: Commit and push result.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git diff --quiet --cached && echo "ไม่มีอะไรเปลี่ยน" && exit 0
          git commit -m "chore: update SSL check result [skip ci]"
          # rebase ก่อน push กันกรณีมีคน commit เข้า main ระหว่าง workflow รัน
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push ครั้งที่ ${attempt} ไม่สำเร็จ — ลองใหม่"
            sleep 5
          done
          exit 1
