name: Check SSL Certificates

on:
  schedule:
    # รันทุกวันเวลา 08:00 น. เวลาไทย (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"
  # อนุญาตให้กดรันด้วยตัวเองได้จากแท็บ Actions ของ GitHub (เพื่อทดสอบ)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-ssl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SSL check script
        run: python check_ssl.py

      - name: Commit and push result.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git diff --quiet --cached || git commit -m "chore: update SSL check result [skip ci]"
          git push
